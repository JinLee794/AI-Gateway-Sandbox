name: Sandbox weekly model pricing

on:
  schedule:
    - cron: '17 8 * * 1' # Monday, 08:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'labs/ai-gateway-sandbox/pricing/**'
      - 'labs/ai-gateway-sandbox/policy.xml'
      - 'labs/ai-gateway-sandbox/responses-pricing-fragment.xml'
      - '.github/workflows/sandbox-*-pricing.yml'

permissions:
  contents: read

concurrency:
  group: sandbox-pricing-${{ github.event_name }}-${{ github.event.pull_request.number || 'weekly' }}
  cancel-in-progress: false

jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline fixture tests
        run: python -m unittest discover -s labs/ai-gateway-sandbox/pricing/tests -v
      - name: Compile and exercise changed C# policy expressions
        shell: pwsh
        run: ./labs/ai-gateway-sandbox/pricing/tests/test_policy.ps1
      - name: Check committed card (bootstrap is deliberately unpublished)
        working-directory: labs/ai-gateway-sandbox/pricing
        run: |
          python - <<'PY'
          import lifecycle
          card = lifecycle.load("rate-card.json")
          if card == {"schemaVersion": 1, "version": "unpublished", "effectiveFrom": None,
                      "currency": "USD", "unit": "1M tokens", "sourceHash": None, "entries": {}}:
              print("Bootstrap only; generation with live discovery is required before publication.")
          else:
              lifecycle.named_value(card)
          PY

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: offline-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sandbox-pricing-discovery
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Azure OIDC (read-only discovery identity)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve explicit account allow list
        env:
          ACCOUNTS: ${{ vars.PRICING_ACCOUNT_IDS }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          accounts = json.loads(os.environ["ACCOUNTS"])
          if not isinstance(accounts, list) or not accounts:
              raise ValueError("PRICING_ACCOUNT_IDS must be a nonempty JSON array of account ARM IDs")
          Path(os.environ["RUNNER_TEMP"], "pricing-accounts.json").write_text(json.dumps(accounts))
          PY
      - name: Discover, fetch, generate and validate
        run: |
          python labs/ai-gateway-sandbox/pricing/lifecycle.py generate --accounts "$RUNNER_TEMP/pricing-accounts.json"
          python labs/ai-gateway-sandbox/pricing/lifecycle.py check
      - name: Build PR body from repository template and price diff
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          template = Path(".github/PULL_REQUEST_TEMPLATE.md").read_text()
          template = template.replace("* ...", "* Review the model price/deployment/source diff below.", 1)
          template = template.replace("[ ] No", "[x] No").replace(
              "[ ] Other... Please describe:", "[x] Other... Please describe: Model rate-card refresh")
          template = template.replace("git clone [repo-address]", 'git clone "https://github.com/' + os.environ["GITHUB_REPOSITORY"] + '.git"')
          template = template.replace("cd [repo-name]", "cd " + os.environ["GITHUB_REPOSITORY"].split("/")[1])
          template = template.replace("git checkout [branch-name]", "git checkout automation/sandbox-weekly-pricing")
          template = template.replace("npm install", "# Standard-library Python; no dependency install needed")
          template = template.replace("* ...", "* All live token deployments are priced; aliases agree; named value fits 4,096 characters.")
          template += """

          Validation performed by this run:
          - `python -m unittest discover -s labs/ai-gateway-sandbox/pricing/tests -v` - passed.
          - `pwsh -File labs/ai-gateway-sandbox/pricing/tests/test_policy.ps1` - passed.
          - `python labs/ai-gateway-sandbox/pricing/lifecycle.py generate --accounts "$RUNNER_TEMP/pricing-accounts.json"` - passed.
          - `python labs/ai-gateway-sandbox/pricing/lifecycle.py check` - passed.

          No Azure writes during refresh. Merge invokes the separately gated publisher.
          """
          template += "\n" + Path("labs/ai-gateway-sandbox/pricing/price-diff.md").read_text()
          Path(os.environ["RUNNER_TEMP"], "pricing-pr.md").write_text(template)
          PY
      - name: Open or update price-list PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.PRICING_PR_TOKEN || github.token }}
          branch: automation/sandbox-weekly-pricing
          base: main
          title: 'chore(sandbox): refresh weekly model rate card'
          commit-message: 'chore(sandbox): refresh weekly model rate card'
          body-path: ${{ runner.temp }}/pricing-pr.md
          add-paths: |
            labs/ai-gateway-sandbox/pricing/rate-card.json
            labs/ai-gateway-sandbox/pricing/price-diff.md
            labs/ai-gateway-sandbox/pricing/history/
          delete-branch: true
